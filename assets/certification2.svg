<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="100%" height="100%">
  <!-- Badge Certification Développement Web Fullstack avec Pop 3D -->
  <g transform="translate(10, 10)">
    <!-- Écusson arrière 3D -->
    <polygon points="50,5 90,20 90,60 50,95 10,60 10,20" fill="none" stroke="#1D4ED8" stroke-width="4" stroke-linejoin="round" transform="translate(3, 3)" />
    <!-- Écusson avant -->
    <polygon points="50,5 90,20 90,60 50,95 10,60 10,20" fill="#0F172A" stroke="#38BDF8" stroke-width="4" stroke-linejoin="round" />
    
    <!-- Cercle intérieur Vert -->
    <circle cx="50" cy="45" r="22" fill="#0F172A" stroke="#34D399" stroke-width="3" />
    
    <!-- Balises de code < / > au centre (Rose) -->
    <path d="M 43 38 L 37 45 L 43 52" fill="none" stroke="#F472B6" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
    <path d="M 57 38 L 63 45 L 57 52" fill="none" stroke="#F472B6" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
    <line x1="52" y1="37" x2="48" y2="53" stroke="#38BDF8" stroke-width="2.5" stroke-linecap="round" />

    <!-- Rubans du bas (Rose 3D) -->
    <path d="M 36 78 L 30 102 L 44 94 L 46 83" fill="#F472B6" stroke="#DB2777" stroke-width="2" />
    <path d="M 64 78 L 70 102 L 56 94 L 54 83" fill="#F472B6" stroke="#DB2777" stroke-width="2" />
  </g>
</svg>
