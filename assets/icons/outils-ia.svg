<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <!-- Icône Outils IA (Puce intelligente & étincelle neuronale) avec Pop 3D -->
  <g transform="translate(15, 15)">
    <!-- Puce centrale carrée en 3D (Fond sombre avec bordure Rose 3D) -->
    <!-- Ombre 3D -->
    <rect x="15" y="15" width="40" height="40" rx="8" fill="none" stroke="#DB2777" stroke-width="3.5" transform="translate(2, 2)" />
    <!-- Face avant -->
    <rect x="15" y="15" width="40" height="40" rx="8" fill="#0F172A" stroke="#F472B6" stroke-width="3.5" />

    <!-- Connecteurs de la puce (Pins) en Vert et Bleu -->
    <!-- Haut -->
    <line x1="25" y1="5" x2="25" y2="15" stroke="#34D399" stroke-width="3" stroke-linecap="round" />
    <line x1="45" y1="5" x2="45" y2="15" stroke="#38BDF8" stroke-width="3" stroke-linecap="round" />
    <!-- Bas -->
    <line x1="25" y1="55" x2="25" y2="65" stroke="#38BDF8" stroke-width="3" stroke-linecap="round" />
    <line x1="45" y1="55" x2="45" y2="65" stroke="#34D399" stroke-width="3" stroke-linecap="round" />
    <!-- Gauche -->
    <line x1="5" y1="25" x2="15" y2="25" stroke="#38BDF8" stroke-width="3" stroke-linecap="round" />
    <line x1="5" y1="45" x2="15" y2="45" stroke="#34D399" stroke-width="3" stroke-linecap="round" />
    <!-- Droite -->
    <line x1="55" y1="25" x2="65" y2="25" stroke="#34D399" stroke-width="3" stroke-linecap="round" />
    <line x1="55" y1="45" x2="65" y2="45" stroke="#38BDF8" stroke-width="3" stroke-linecap="round" />

    <!-- Étincelle / Étoile centrale IA en Vert Menthe 3D -->
    <path d="M 35 23 L 38 31 L 47 35 L 38 39 L 35 47 L 32 39 L 23 35 L 32 31 Z" 
          fill="#34D399" 
          stroke="#047857" 
          stroke-width="1.5" />
    <circle cx="35" cy="35" r="3" fill="#FFFFFF" />
  </g>
</svg>
