<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <!-- Style Pop 3D subtil -->
  <g transform="translate(10, 10)">
    <!-- Cadre de l'écran / fenêtre UI (Bleu) -->
    <!-- Ombre 3D -->
    <rect x="5" y="5" width="70" height="50" rx="8" fill="none" stroke="#1D4ED8" stroke-width="4" transform="translate(2, 2)" />
    <!-- Face avant -->
    <rect x="5" y="5" width="70" height="50" rx="8" fill="#0F172A" stroke="#38BDF8" stroke-width="4" />
    
    <!-- Barre de titre & points -->
    <circle cx="16" cy="15" r="3" fill="#F472B6" />
    <circle cx="26" cy="15" r="3" fill="#34D399" />
    <circle cx="36" cy="15" r="3" fill="#38BDF8" />

    <!-- Balises de code Frontend < / > (Rose et Vert 3D) -->
    <!-- Crochet gauche (Rose) -->
    <path d="M 28 27 L 20 35 L 28 43" fill="none" stroke="#DB2777" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" transform="translate(1.5, 1.5)" />
    <path d="M 28 27 L 20 35 L 28 43" fill="none" stroke="#F472B6" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" />

    <!-- Slash central (Bleu) -->
    <line x1="44" y1="26" x2="36" y2="44" stroke="#1D4ED8" stroke-width="3" stroke-linecap="round" transform="translate(1.5, 1.5)" />
    <line x1="44" y1="26" x2="36" y2="44" stroke="#38BDF8" stroke-width="3" stroke-linecap="round" />

    <!-- Crochet droit (Vert) -->
    <path d="M 52 27 L 60 35 L 52 43" fill="none" stroke="#047857" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" transform="translate(1.5, 1.5)" />
    <path d="M 52 27 L 60 35 L 52 43" fill="none" stroke="#34D399" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" />

    <!-- Pied du moniteur -->
    <path d="M 40 55 L 40 68 M 28 68 L 52 68" fill="none" stroke="#38BDF8" stroke-width="4" stroke-linecap="round" />
  </g>
</svg>
