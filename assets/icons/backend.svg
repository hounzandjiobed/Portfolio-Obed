<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <!-- Icône Backend (Serveur & Base de données MySQL/Django) avec Pop 3D -->
  <g transform="translate(15, 12)">
    
    <!-- Cylindre Haut de Base de données (Vert Menthe 3D) -->
    <!-- Ombre 3D -->
    <path d="M 10 20 C 10 13, 60 13, 60 20 L 60 30 C 60 37, 10 37, 10 30 Z" fill="none" stroke="#047857" stroke-width="3.5" transform="translate(2, 2)" />
    <!-- Face avant -->
    <path d="M 10 20 C 10 13, 60 13, 60 20 L 60 30 C 60 37, 10 37, 10 30 Z" fill="#0F172A" stroke="#34D399" stroke-width="3.5" />
    <ellipse cx="35" cy="20" rx="25" ry="7" fill="none" stroke="#34D399" stroke-width="3.5" />

    <!-- Cylindre Milieu (Bleu Cyan 3D) -->
    <path d="M 10 33 C 10 40, 60 40, 60 33 L 60 45 C 60 52, 10 52, 10 45 Z" fill="none" stroke="#1D4ED8" stroke-width="3.5" transform="translate(2, 2)" />
    <path d="M 10 33 C 10 40, 60 40, 60 33 L 60 45 C 60 52, 10 52, 10 45 Z" fill="#0F172A" stroke="#38BDF8" stroke-width="3.5" />

    <!-- Cylindre Bas (Rose 3D) -->
    <path d="M 10 48 C 10 55, 60 55, 60 48 L 60 60 C 60 67, 10 67, 10 60 Z" fill="none" stroke="#DB2777" stroke-width="3.5" transform="translate(2, 2)" />
    <path d="M 10 48 C 10 55, 60 55, 60 48 L 60 60 C 60 67, 10 67, 10 60 Z" fill="#0F172A" stroke="#F472B6" stroke-width="3.5" />

    <!-- Voyants d'état serveur -->
    <circle cx="20" cy="24" r="2.5" fill="#34D399" />
    <circle cx="20" cy="39" r="2.5" fill="#38BDF8" />
    <circle cx="20" cy="54" r="2.5" fill="#F472B6" />

    <!-- Ligne de flux API / Connexions -->
    <path d="M 60 35 L 72 35 L 72 50 L 62 50" fill="none" stroke="#38BDF8" stroke-width="2.5" stroke-linecap="round" stroke-dasharray="4 2" />
  </g>
</svg>
