<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="100%" height="100%">
  <!-- Badge Certification Python & Backend avec Pop 3D -->
  <g transform="translate(10, 10)">
    <!-- Écusson arrière 3D -->
    <polygon points="50,5 90,20 90,60 50,95 10,60 10,20" fill="none" stroke="#047857" stroke-width="4" stroke-linejoin="round" transform="translate(3, 3)" />
    <!-- Écusson avant -->
    <polygon points="50,5 90,20 90,60 50,95 10,60 10,20" fill="#0F172A" stroke="#34D399" stroke-width="4" stroke-linejoin="round" />
    
    <!-- Cercle intérieur Rose -->
    <circle cx="50" cy="45" r="22" fill="#0F172A" stroke="#F472B6" stroke-width="3" />
    
    <!-- Étoile de réussite au centre -->
    <path d="M 50 32 L 53 41 L 62 42 L 55 48 L 57 57 L 50 52 L 43 57 L 45 48 L 38 42 L 47 41 Z" fill="#34D399" />

    <!-- Rubans du bas (Bleu 3D) -->
    <path d="M 36 78 L 30 102 L 44 94 L 46 83" fill="#38BDF8" stroke="#1D4ED8" stroke-width="2" />
    <path d="M 64 78 L 70 102 L 56 94 L 54 83" fill="#38BDF8" stroke="#1D4ED8" stroke-width="2" />
  </g>
</svg>
